name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  tests:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # - name: Setup .NET
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Run Tests
      run: |
        dotnet test "DotNetApiExampleCICD.Tests/DotNetApiExampleCICD.Tests.csproj" \
          --no-restore \
          --verbosity normal 

        echo $ConnectionStrings__DefaultConnection
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.APP_SETTINGS_STRING_CONNECTION_FOR_TESTING }}


  build:
    needs: tests

    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Generate Version
      id: version
      uses: paulhatch/semantic-version@v5.4.0
      with:
        tag_prefix: "v"
        major_pattern: "major:"
        minor_pattern: "feat:"

    - name: Set Variables
      run: |
          echo "NEW_VERSION=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          echo "DOCKER_CONTAINER=${{ secrets.DOCKER_CONTAINER }}" >> $GITHUB_ENV

    - name: Docker Login
      run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
          -u "${{ secrets.DOCKER_USER }}" \
          --password-stdin

    - name: Build Docker Image
      run: |
          docker build \
            -t "$DOCKER_CONTAINER:$NEW_VERSION" \
            -t "$DOCKER_CONTAINER:latest" .

    - name: Push Docker Image
      run: |
          docker push "$DOCKER_CONTAINER:$NEW_VERSION"
          docker push "$DOCKER_CONTAINER:latest"

    - name: Docker Logout
      run: docker logout
    
  
