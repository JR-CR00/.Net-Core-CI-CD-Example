services:
  api:
    image: $DOCKER_CONTAINER:$NEW_VERSION
    container_name: miapi
    volumes:
      - ./wwwroot:/app/wwwroot
    environment:
      - ASPNETCORE_ENVIRONMENT=$ASPNETCORE_ENVIRONMENT
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - SecretKey=${SECRET_KEY}
    networks:
      - proxy-network
    restart: unless-stopped
    expose:
      - "8080"

networks:
  proxy-network:
    external: true